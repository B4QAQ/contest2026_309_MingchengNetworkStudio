# HD-RK3506-EVM network configuration (consumed by `netcfg`).
# Lines: key=value, one per line. '#' starts a comment.
#
# mode      dhcp | static
# auto_dhcp 1 | 0   re-run DHCP automatically when the eth0 link comes
#                   up (cable plug / switch STP expiry).  dhcp mode only.
# ip / netmask / gateway / dns   used in static mode.

mode=dhcp
auto_dhcp=1

# --- static-mode example ---
# mode=static
# ip=192.168.10.50
# netmask=255.255.255.0
# gateway=192.168.10.1
# dns=192.168.10.1
